<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Default / Fallback SEO Tags -->
    <title>ZIH Marketing Consultancy</title>
    <meta name="description" content="World-class strategic marketing, branding, and advertising solutions to help businesses achieve sustainable growth." />
    
    <!-- Open Graph Fallback -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.zhmktg.com/" />
    <meta property="og:title" content="ZIH Marketing Consultancy" />
    <meta property="og:description" content="World-class strategic marketing, branding, and advertising solutions to help businesses achieve sustainable growth." />

    <!-- Preconnect & Non-Render-Blocking Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      />
    </noscript>
  </head>
